<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat SIMPEG PU...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-app-region: drag;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .splash-card {
            width: 440px;
            height: 290px;
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 28px 26px 22px;
            position: relative;
        }

        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .logo-wrapper {
            width: 72px;
            height: 72px;
            background: #FEF3C7;
            border: 1px solid #FCD34D;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .agency-badge {
            background: #FEF3C7;
            color: #92400E;
            border: 1px solid #FCD34D;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 6px;
            display: inline-block;
        }

        .app-title {
            font-size: 22px;
            font-weight: 800;
            color: #0F172A;
            letter-spacing: 0.5px;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .app-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: #475569;
        }

        .footer-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            background: #FEF3C7;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            width: 35%;
            height: 100%;
            background: #F59E0B;
            border-radius: 10px;
            position: absolute;
            animation: loading-slide 1.6s infinite ease-in-out;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #475569;
        }

        .status-text {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #F59E0B;
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.2s infinite ease-in-out;
        }

        .version-badge {
            font-size: 10px;
            color: #94A3B8;
            font-weight: 600;
        }

        @keyframes loading-slide {
            0% {
                left: -35%;
                width: 30%;
            }
            50% {
                left: 35%;
                width: 45%;
            }
            100% {
                left: 100%;
                width: 30%;
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="brand-section">
            <div class="logo-wrapper">
                <img src="images/logo.png" alt="Logo Pemprov Sulsel" class="logo-img">
            </div>
            <div class="agency-badge">Dinas PU Prov. Sulsel</div>
            <h1 class="app-title">SIMPEG PU</h1>
            <p class="app-subtitle">Sistem Pemantauan Pegawai</p>
        </div>

        <div class="footer-section">
            <div class="progress-track">
                <div class="progress-bar"></div>
            </div>
            <div class="status-row">
                <span class="status-text">
                    <span class="status-dot"></span>
                    Menyiapkan data pegawai...
                </span>
                <span class="version-badge">Desktop Edition • v1.0.0</span>
            </div>
        </div>
    </div>
</body>
</html>
